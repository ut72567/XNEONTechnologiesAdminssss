<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XNEON | Master Admin Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root { --neon: #39FF14; --dark: #000; --card: #111; --border: #222; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--dark); color: #fff; overflow-x: hidden; min-height: 100vh; }

        /* Auth Screen */
        #auth-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--card); padding: 40px; border-radius: 15px; border: 1px solid var(--border); width: 95%; max-width: 400px; text-align: center; }
        
        /* Dashboard Wrapper */
        #admin-wrapper { display: none; width: 100%; }
        
        /* Layout */
        .sidebar { width: 250px; height: 100vh; background: #080808; border-right: 1px solid var(--border); position: fixed; left: 0; top: 0; }
        .main { margin-left: 250px; padding: 40px; width: calc(100% - 250px); }
        .page { display: none; }
        .page.active { display: block; }

        /* Components */
        .btn-neon { background: var(--neon); color: #000; padding: 12px; border-radius: 6px; font-weight: 700; border: none; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s; }
        .btn-neon:hover { opacity: 0.9; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #1a1a1a; border: 1px solid var(--border); color: #fff; border-radius: 6px; outline: none; }
        .sidebar-header { padding: 30px; text-align: center; color: var(--neon); font-weight: 800; font-size: 1.5rem; }
        .nav-btn { width: 100%; padding: 15px 25px; background: none; border: none; color: #888; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 15px; border-right: 3px solid transparent; }
        .nav-btn.active { color: var(--neon); background: rgba(57, 255, 20, 0.05); border-right: 3px solid var(--neon); }
        
        .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card); border-radius: 8px; overflow: hidden; }
        .data-table th, .data-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .data-table th { color: var(--neon); background: #0a0a0a; font-weight: 600; }
        img.table-img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }

        /* Modal Styles */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; width: 100%; max-width: 450px; position: relative; }
        .modal-card h3 { color: var(--neon); margin-bottom: 15px; }
        .close-modal { position: absolute; top: 15px; right: 15px; cursor: pointer; color: #666; font-size: 1.2rem; }
        
        .address-text { background: #000; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; font-size: 0.85rem; line-height: 1.6; color: #ccc; }
        .address-text strong { color: #fff; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2 style="color: var(--neon); margin-bottom: 20px;">XNEON ADMIN</h2>
            <div id="email-step">
                <input type="email" id="admin-email-input" placeholder="Admin Email" value="tripathivlogs39@gmail.com">
                <button class="btn-neon" id="send-otp-btn">SEND OTP</button>
            </div>
            <div id="otp-step" style="display: none;">
                <p style="font-size: 0.8rem; color: #888; margin-bottom: 10px;">Check your email for the 4-digit code.</p>
                <input type="text" id="admin-otp-input" placeholder="Enter OTP" maxlength="4">
                <button class="btn-neon" id="verify-otp-btn">VERIFY ACCESS</button>
            </div>
            <p id="auth-msg" style="margin-top: 15px; font-size: 0.8rem; min-height: 20px;"></p>
        </div>
    </div>

    <div id="order-modal" class="modal">
        <div class="modal-card">
            <i class="fas fa-times close-modal" onclick="closeOrderModal()"></i>
            <h3>Customer Details</h3>
            
            <p style="font-size: 0.8rem; color: #888; margin-bottom: 5px;">Full Information:</p>
            <div class="address-text" id="modal-address">Loading...</div>
            
            <p style="font-size: 0.8rem; color: #888; margin-bottom: 5px;">Change Order Status:</p>
            <select id="modal-status-select">
                <option value="Pending">Pending</option>
                <option value="Processing">Processing</option>
                <option value="Shipped">Shipped</option>
                <option value="Delivered">Delivered</option>
                <option value="Cancelled">Cancelled</option>
            </select>
            <button class="btn-neon" id="update-status-btn">Update Status</button>
        </div>
    </div>

    <div id="admin-wrapper">
        <div class="sidebar">
            <div class="sidebar-header">XNEON</div>
            <button class="nav-btn active" onclick="switchPage('dashboard', this)"><i class="fas fa-home"></i> Dashboard</button>
            <button class="nav-btn" onclick="switchPage('products-page', this)"><i class="fas fa-box"></i> Products</button>
            <button class="nav-btn" onclick="switchPage('orders-page', this)"><i class="fas fa-shopping-bag"></i> Orders</button>
            <button class="nav-btn" onclick="switchPage('slider-page', this)"><i class="fas fa-images"></i> Sliders</button>
        </div>

        <div class="main">
            <section id="dashboard" class="page active">
                <h1>Admin Dashboard</h1>
                <p>Status: <span style="color:var(--neon)">Online</span></p>
            </section>

            <section id="products-page" class="page">
                <h1>Inventory</h1>
                <table class="data-table">
                    <thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Action</th></tr></thead>
                    <tbody id="admin-product-list"></tbody>
                </table>
            </section>

            <section id="orders-page" class="page">
                <h1>Customer Orders</h1>
                <table class="data-table">
                    <thead><tr><th>Order ID</th><th>Customer</th><th>Status</th><th>Full Details</th></tr></thead>
                    <tbody id="admin-order-list"></tbody>
                </table>
            </section>

            <section id="slider-page" class="page">
                <h1>Slider Images</h1>
                <table class="data-table">
                    <thead><tr><th>Preview</th><th>Image URL</th><th>Action</th></tr></thead>
                    <tbody id="slider-table-body"></tbody>
                </table>
            </section>
        </div>
    </div>

    <script>
        // 1. INITIALIZE EXTERNAL SERVICES
        (function() {
            emailjs.init("7ps995woJ-0Gp79Nm");
        })();

        const firebaseConfig = {
            apiKey: "AIzaSyCCc2pN-sdmwoz1aXxqX4rnN1-oUU_5s7w",
            authDomain: "xneon-c12a2.firebaseapp.com",
            projectId: "xneon-c12a2",
            databaseURL: "https://xneon-c12a2-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. STATE VARIABLES
        let systemOTP = "";
        let currentOrderRef = "";
        let orderCache = {};

        // 3. UI HELPERS
        function switchPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            btn.classList.add('active');
        }

        function closeOrderModal() {
            document.getElementById('order-modal').classList.remove('active');
        }

        // 4. AUTHENTICATION (Send OTP)
        document.getElementById('send-otp-btn').addEventListener('click', function() {
            const emailInput = document.getElementById('admin-email-input').value.trim();
            const msg = document.getElementById('auth-msg');

            msg.innerText = "Processing...";
            msg.style.color = "#888";

            if (emailInput !== "tripathivlogs39@gmail.com") {
                msg.innerText = "Error: Unauthorized Email Address.";
                msg.style.color = "red";
                return;
            }

            systemOTP = Math.floor(1000 + Math.random() * 9000).toString();

            emailjs.send('service_3vbmeu4', 'template_0lecpgb', {
                to_email: emailInput,
                otp: systemOTP
            }).then(function() {
                document.getElementById('email-step').style.display = 'none';
                document.getElementById('otp-step').style.display = 'block';
                msg.innerText = "Success: OTP Sent to Email.";
                msg.style.color = "#39FF14";
            }, function(error) {
                console.error("EmailJS Error:", error);
                msg.innerText = "Failed to send email. Check console.";
                msg.style.color = "red";
            });
        });

        // 5. AUTHENTICATION (Verify OTP)
        document.getElementById('verify-otp-btn').addEventListener('click', function() {
            const entered = document.getElementById('admin-otp-input').value.trim();
            if (entered === systemOTP) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('admin-wrapper').style.display = 'block';
                loadStoreData(); // Start Loading Data
            } else {
                alert("Incorrect OTP. Please try again.");
            }
        });

        // 6. LOAD FIREBASE DATA
        function loadStoreData() {
            // Products
            db.ref('products').on('value', (snap) => {
                const list = document.getElementById('admin-product-list');
                list.innerHTML = "";
                snap.forEach(child => {
                    const p = child.val();
                    list.innerHTML += `<tr>
                        <td><img src="${p.imageUrl}" class="table-img"></td>
                        <td>${p.name}</td>
                        <td>₹${p.price}</td>
                        <td><button class="delete-btn" data-type="products" data-key="${child.key}" style="color:red; cursor:pointer; background:none; border:none;">Delete</button></td>
                    </tr>`;
                });
            });

            // Orders
            db.ref('orders').on('value', (snap) => {
                const list = document.getElementById('admin-order-list');
                list.innerHTML = "";
                orderCache = {}; // Clear Cache

                snap.forEach(userNode => {
                    userNode.forEach(orderNode => {
                        const o = orderNode.val();
                        const path = `orders/${userNode.key}/${orderNode.key}`;
                        orderCache[path] = o; // Save to memory

                        const statusColor = o.status === 'Delivered' ? 'var(--neon)' : o.status === 'Cancelled' ? 'red' : '#ffaa00';

                        list.innerHTML += `<tr>
                            <td style="color:var(--neon); font-weight:bold;">${o.orderId}</td>
                            <td>${o.shippingDetails?.name || 'Customer'}</td>
                            <td style="color:${statusColor}">${o.status}</td>
                            <td><button class="manage-btn" data-path="${path}" style="background:#222; color:#fff; padding:5px 10px; border:1px solid #333; cursor:pointer;">Manage</button></td>
                        </tr>`;
                    });
                });
            });

            // Sliders
            db.ref('sliderImages').on('value', (snap) => {
                const list = document.getElementById('slider-table-body');
                list.innerHTML = "";
                snap.forEach(child => {
                    list.innerHTML += `<tr>
                        <td><img src="${child.val().downloadURL}" class="table-img"></td>
                        <td>${child.val().downloadURL}</td>
                        <td><button class="delete-btn" data-type="sliderImages" data-key="${child.key}" style="color:red; cursor:pointer; background:none; border:none;">Delete</button></td>
                    </tr>`;
                });
            });
        }

        // 7. GLOBAL CLICK LISTENER (For Dynamic Buttons)
        document.addEventListener('click', function(e) {
            
            // Delete Logic
            if(e.target.classList.contains('delete-btn')) {
                const type = e.target.getAttribute('data-type');
                const key = e.target.getAttribute('data-key');
                if(confirm("Delete this item?")) {
                    db.ref(type + '/' + key).remove();
                }
            }

            // Open Manage Modal
            if(e.target.classList.contains('manage-btn')) {
                currentOrderRef = e.target.getAttribute('data-path');
                const o = orderCache[currentOrderRef];
                const ship = o.shippingDetails || {};

                // --- PHONE & PINCODE (HIGHLIGHTED) ---
                const phone = ship.phone || ship.phoneNumber || ship.mobile || "N/A";
                const pincode = ship.pincode || ship.zip || ship.zipcode || "N/A";

                const html = `
                    <div style="margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:10px;">
                        <strong>Name:</strong> ${ship.name || 'N/A'}<br>
                        <strong style="color:var(--neon)">Phone:</strong> ${phone}<br>
                        <strong>Email:</strong> ${ship.email || o.email || 'N/A'}
                    </div>
                    <div>
                        <strong>Address:</strong> ${ship.houseNo || ship.address || ''}<br>
                        <strong>Village/Street:</strong> ${ship.village || ship.street || ''}<br>
                        <strong>City:</strong> ${ship.city || ''}, ${ship.state || ''}<br>
                        <strong style="color:var(--neon)">Pincode:</strong> ${pincode}<br>
                        <strong>Country:</strong> ${ship.country || 'India'}
                    </div>
                `;
                document.getElementById('modal-address').innerHTML = html;
                document.getElementById('modal-status-select').value = o.status;
                document.getElementById('order-modal').classList.add('active');
            }
        });

        // 8. UPDATE ORDER STATUS
        document.getElementById('update-status-btn').onclick = function() {
            const newStatus = document.getElementById('modal-status-select').value;
            if(currentOrderRef) {
                db.ref(currentOrderRef).update({ status: newStatus }).then(() => {
                    alert("Status Updated!");
                    closeOrderModal();
                });
            }
        };
    </script>
</body>
</html>
