l<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XNEON | Master Admin Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #39FF14; --dark: #000; --card: #111; --border: #222; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--dark); color: #fff; display: flex; }
        
        /* Sidebar */
        .sidebar { width: 250px; height: 100vh; background: #080808; border-right: 1px solid var(--border); position: fixed; }
        .sidebar-header { padding: 30px; text-align: center; color: var(--neon); font-weight: 800; font-size: 1.5rem; }
        .nav-btn { width: 100%; padding: 15px 25px; background: none; border: none; color: #888; text-align: left; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 15px; }
        .nav-btn.active { color: var(--neon); background: rgba(57, 255, 20, 0.05); border-right: 3px solid var(--neon); }
        
        /* Main */
        .main { margin-left: 250px; padding: 40px; width: 100%; }
        .page { display: none; }
        .page.active { display: block; }
        
        /* Components */
        .search-box { width: 100%; max-width: 400px; padding: 12px; background: #1a1a1a; border: 1px solid var(--border); color: #fff; border-radius: 8px; margin-bottom: 20px; outline: none; }
        .search-box:focus { border-color: var(--neon); }
        .data-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
        .data-table th, .data-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
        .data-table th { color: var(--neon); font-size: 0.75rem; background: #0a0a0a; text-transform: uppercase; }
        
        .btn-neon { background: var(--neon); color: #000; padding: 10px 20px; border-radius: 6px; font-weight: 700; border: none; cursor: pointer; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 2000; }
        .modal.active { display: flex; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 12px; width: 450px; border: 1px solid var(--border); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #1a1a1a; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">XNEON</div>
        <button class="nav-btn active" onclick="window.showPage('dashboard', this)"><i class="fas fa-home"></i> Dashboard</button>
        <button class="nav-btn" onclick="window.showPage('products-page', this)"><i class="fas fa-box"></i> Products</button>
        <button class="nav-btn" onclick="window.showPage('orders-page', this)"><i class="fas fa-shopping-bag"></i> Orders</button>
        <button class="nav-btn" onclick="window.showPage('slider-page', this)"><i class="fas fa-images"></i> Sliders</button>
    </div>

    <div class="main">
        <section id="dashboard" class="page active">
            <h1>Admin Dashboard</h1>
            <p style="color: #666;">Status: Connected to ORD Numbering System</p>
        </section>

        <section id="products-page" class="page">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h1>Inventory</h1>
                <button class="btn-neon" onclick="window.openModal('product-modal')">+ Add Product</button>
            </div>
            <table class="data-table">
                <thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Action</th></tr></thead>
                <tbody id="admin-product-list"></tbody>
            </table>
        </section>

        <section id="orders-page" class="page">
            <h1>Order Management</h1>
            <input type="text" class="search-box" id="orderSearch" onkeyup="window.searchOrders()" placeholder="Search ORD Number (e.g. ORD 01)">
            <table class="data-table">
                <thead><tr><th>Order No</th><th>Customer</th><th>Status</th><th>Update</th></tr></thead>
                <tbody id="admin-order-list"></tbody>
            </table>
        </section>

        <section id="slider-page" class="page">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h1>Home Sliders</h1>
                <button class="btn-neon" onclick="window.openModal('slider-modal')">+ Add Slider</button>
            </div>
            <table class="data-table">
                <thead><tr><th>Preview</th><th>URL</th><th>Action</th></tr></thead>
                <tbody id="slider-table-body"></tbody>
            </table>
        </section>
    </div>

    <div id="product-modal" class="modal"><div class="modal-box"><h2>Add Product</h2><input id="p-name" placeholder="Name"><input id="p-price" placeholder="Price"><input id="p-img" placeholder="Image URL"><button class="btn-neon" onclick="window.saveProduct()">Save</button><button class="btn-neon" style="background:#444; margin-left:10px;" onclick="window.closeModal('product-modal')">Cancel</button></div></div>
    <div id="slider-modal" class="modal"><div class="modal-box"><h2>Add Slider</h2><input id="s-url" placeholder="Image URL"><button class="btn-neon" onclick="window.saveSlider()">Save</button><button class="btn-neon" style="background:#444; margin-left:10px;" onclick="window.closeModal('slider-modal')">Cancel</button></div></div>
    <div id="ship-modal" class="modal"><div class="modal-box"><h2>Shipping Info</h2><input id="ship-partner" placeholder="Shipping Partner"><input id="ship-track" placeholder="Tracking ID"><button class="btn-neon" onclick="window.confirmShipping()">Update & Notify</button></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, update, push } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCc2pN-sdmwoz1aXxqX4rnN1-oUU_5s7w",
            authDomain: "xneon-c12a2.firebaseapp.com",
            projectId: "xneon-c12a2",
            storageBucket: "xneon-c12a2.firebasestorage.app",
            messagingSenderId: "167464497598",
            appId: "1:167464497598:web:39d973982f33b6a17d49ef",
            databaseURL: "https://xneon-c12a2-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentOrderPath = "";

        // --- GLOBAL FUNCTIONS (Attached to window so buttons work) ---
        window.showPage = (id, btn) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        };

        window.openModal = (id) => document.getElementById(id).classList.add('active');
        window.closeModal = (id) => document.getElementById(id).classList.remove('active');

        window.saveProduct = () => {
            const data = { name: document.getElementById('p-name').value, price: document.getElementById('p-price').value, imageUrl: document.getElementById('p-img').value };
            push(ref(db, 'products'), data).then(() => { window.closeModal('product-modal'); });
        };

        window.saveSlider = () => {
            const url = document.getElementById('s-url').value;
            push(ref(db, 'sliderImages'), { downloadURL: url }).then(() => { window.closeModal('slider-modal'); });
        };

        window.statusHandler = (path, val) => {
            if(val === 'Shipped') { currentOrderPath = path; window.openModal('ship-modal'); }
            else update(ref(db, path), { status: val });
        };

        window.confirmShipping = () => {
            update(ref(db, currentOrderPath), { 
                status: 'Shipped', 
                shippingPartner: document.getElementById('ship-partner').value, 
                trackingId: document.getElementById('ship-track').value 
            }).then(() => window.closeModal('ship-modal'));
        };

        window.searchOrders = () => {
            const input = document.getElementById('orderSearch').value.toUpperCase();
            const rows = document.getElementById('admin-order-list').getElementsByTagName('tr');
            for (let row of rows) {
                const idCell = row.getElementsByTagName('td')[0];
                row.style.display = (idCell && idCell.innerText.toUpperCase().includes(input)) ? "" : "none";
            }
        };

        window.deleteItem = (path) => { if(confirm("Delete item?")) remove(ref(db, path)); };

        // --- REAL-TIME DATA LOADING ---
        onValue(ref(db, 'products'), s => {
            const list = document.getElementById('admin-product-list');
            list.innerHTML = "";
            s.forEach(c => {
                const p = c.val();
                list.innerHTML += `<tr><td><img src="${p.imageUrl}" width="40"></td><td>${p.name}</td><td>₹${p.price}</td><td><button onclick="window.deleteItem('products/${c.key}')" style="color:red; background:none; border:none; cursor:pointer;">Delete</button></td></tr>`;
            });
        });

        onValue(ref(db, 'sliderImages'), s => {
            const list = document.getElementById('slider-table-body');
            list.innerHTML = "";
            s.forEach(c => {
                list.innerHTML += `<tr><td><img src="${c.val().downloadURL}" width="60"></td><td>${c.val().downloadURL}</td><td><button onclick="window.deleteItem('sliderImages/${c.key}')" style="color:red; background:none; border:none; cursor:pointer;">Delete</button></td></tr>`;
            });
        });

        onValue(ref(db, 'orders'), s => {
            const list = document.getElementById('admin-order-list');
            list.innerHTML = "";
            s.forEach(userNode => {
                userNode.forEach(orderNode => {
                    const o = orderNode.val();
                    const path = `orders/${userNode.key}/${orderNode.key}`;
                    list.innerHTML += `<tr>
                        <td style="color:var(--neon); font-weight:bold;">${o.orderId}</td>
                        <td>${o.shippingDetails.name}</td>
                        <td>${o.status}</td>
                        <td>
                            <select onchange="window.statusHandler('${path}', this.value)" style="background:#222; color:#fff; padding:5px; border-radius:4px;">
                                <option value="Pending" ${o.status=='Pending'?'selected':''}>Pending</option>
                                <option value="Shipped" ${o.status=='Shipped'?'selected':''}>Shipped</option>
                                <option value="Delivered" ${o.status=='Delivered'?'selected':''}>Delivered</option>
                                <option value="Cancelled" ${o.status=='Cancelled'?'selected':''}>Cancelled</option>
                            </select>
                        </td>
                    </tr>`;
                });
            });
        });
    </script>
</body>
</html>
